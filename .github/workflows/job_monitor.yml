name: Job Monitor

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC daily (08:00 / 20:00 Kyiv time in summer).
    # Adjust as you like: https://crontab.guru
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Not a secret -- set via Settings -> Secrets and variables ->
          # Actions -> Variables tab. Comma-separated, defaults to "android".
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
        run: python job_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update seen-jobs state [skip ci]"
          git push
