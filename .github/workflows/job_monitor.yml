name: Job Monitor

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC daily (08:00 / 20:00 Kyiv time in summer).
    # Adjust as you like: https://crontab.guru
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Not a secret -- set via Settings -> Secrets and variables ->
          # Actions -> Variables tab. Comma-separated, defaults to "android".
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
        run: python job_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update seen-jobs state [skip ci]"

          # Scheduled runs can sit queued for a while on GitHub's free tier,
          # so two runs (or a manual rerun) can end up racing to push. Retry
          # with a rebase instead of failing outright, which would otherwise
          # silently drop this run's state update and cause the next run to
          # re-alert on the same items.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push state.json after 5 attempts"
          exit 1
